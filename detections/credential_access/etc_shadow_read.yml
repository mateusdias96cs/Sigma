title: Sensitive Read of /etc/shadow by a File-Reading Utility
id: 7f3a1e20-0a03-4a10-9e01-a1b2c3d4e003
status: experimental
description: |
    Detects a common file-reading utility being used to read the contents of
    `/etc/shadow`, which stores hashed user passwords. Dumping the hashes is a
    precursor to offline password cracking. Tools that merely stat the file
    (e.g. `ls`) are intentionally excluded to focus on content access.
references:
    - https://attack.mitre.org/techniques/T1003/008/
author: sentinel-as-code
date: 2026-01-15
modified: 2026-01-15
tags:
    - attack.credential_access
    - attack.t1003.008
logsource:
    product: linux
    category: process_creation
detection:
    selection_path:
        process.command_line|contains: '/etc/shadow'
    selection_reader:
        process.name:
            - cat
            - less
            - more
            - head
            - tail
            - cp
            - xxd
            - od
            - strings
            - vi
            - vim
            - nano
    condition: selection_path and selection_reader
falsepositives:
    - Backup or integrity-checking tooling that copies /etc/shadow. Allow-list
      the specific backup service account.
level: high
