title: SUID/SGID Bit Set on a Binary via chmod
id: 7f3a1e20-0a05-4a10-9e01-a1b2c3d4e005
status: experimental
description: |
    Detects `chmod` being used to set the setuid/setgid bit on a file. Setting
    the SUID bit makes a binary run with the owner's privileges (often root),
    which adversaries abuse to establish a privilege-escalation foothold (e.g.
    `chmod u+s /tmp/rootbash`).
references:
    - https://attack.mitre.org/techniques/T1548/001/
    - https://gtfobins.github.io/#+suid
author: sentinel-as-code
date: 2026-01-15
modified: 2026-01-15
tags:
    - attack.privilege_escalation
    - attack.t1548.001
logsource:
    product: linux
    category: process_creation
detection:
    selection_chmod:
        process.name: chmod
    selection_suid:
        process.command_line|contains:
            - 'u+s'
            - 'g+s'
            - ' 4755'
            - ' 4711'
            - ' 6755'
            - ' 2755'
    condition: selection_chmod and selection_suid
falsepositives:
    - Package managers or installers that legitimately set SUID on system
      binaries (e.g. during package post-install). Correlate with the parent
      process (dpkg/rpm) to tune.
level: high
