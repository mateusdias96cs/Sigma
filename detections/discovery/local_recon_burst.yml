title: Local System and User Discovery Burst
id: 7f3a1e20-0a06-4a10-9e01-a1b2c3d4e006
status: experimental
description: |
    Detects a burst of local reconnaissance executed in a single command,
    chaining user- and system-discovery utilities (e.g.
    `whoami; id; uname -a`). A single one of these commands is benign; running
    several together in one line is a strong signal of hands-on-keyboard
    enumeration shortly after access is gained.
references:
    - https://attack.mitre.org/techniques/T1033/
    - https://attack.mitre.org/techniques/T1082/
author: sentinel-as-code
date: 2026-01-15
modified: 2026-01-15
tags:
    - attack.discovery
    - attack.t1033
    - attack.t1082
logsource:
    product: linux
    category: process_creation
detection:
    selection_recon_chain:
        process.command_line|contains|all:
            - 'whoami'
            - 'id'
            - 'uname'
    condition: selection_recon_chain
falsepositives:
    - Onboarding/diagnostic scripts that print system facts. Allow-list known
      inventory tooling by parent process or path.
level: medium
