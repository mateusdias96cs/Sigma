# Single-node Elasticsearch + Kibana for local detection development and demos.
# Memory is capped so this runs comfortably on a laptop. Security is set to the
# minimum needed for a local-only stack — do NOT expose these ports publicly.
#
# Usage:
#   make up      # start in the background
#   make down    # stop and remove
#
# Default local credentials (override via a .env file next to this compose file):
#   user: elastic   password: changeme123
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: sentinel-es
    environment:
      - node.name=sentinel-es
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-changeme123}
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - xpack.license.self_generated.type=basic
    ulimits:
      memlock:
        soft: -1
        hard: -1
    mem_limit: 2g
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u elastic:${ELASTIC_PASSWORD:-changeme123} http://localhost:9200/_cluster/health | grep -q '\"status\"'"]
      interval: 10s
      timeout: 10s
      retries: 30
    volumes:
      - es-data:/usr/share/elasticsearch/data

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.4
    container_name: sentinel-kibana
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_PASSWORD:-changeme123}
      # A fixed 32+ char key keeps saved objects (incl. detection rules) stable
      # across restarts. Replace for anything beyond local use.
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=sentinel_local_dev_key_change_me_32x
    mem_limit: 1500m
    ports:
      - "5601:5601"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:5601/api/status | grep -q available"]
      interval: 15s
      timeout: 10s
      retries: 30

volumes:
  es-data:
    driver: local
