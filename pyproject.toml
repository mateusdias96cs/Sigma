[project]
name = "sentinel-as-code"
version = "0.1.0"
description = "Detection-as-Code platform: manage Sigma detection rules as code with automated TP/FP tests, SIEM conversion, MITRE ATT&CK coverage and AI-assisted rule generation with a human in the loop."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "sentinel-as-code" }]
keywords = ["sigma", "detection-engineering", "blue-team", "siem", "mitre-attack", "detection-as-code"]

dependencies = [
    "pysigma>=0.11.0",
    "pysigma-backend-elasticsearch>=1.1.0",
    "sigma-cli>=1.0.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pyyaml>=6.0.1",
    "requests>=2.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "yamllint>=1.35.0",
    "pre-commit>=3.7.0",
    "types-requests>=2.32.0",
    "types-PyYAML>=6.0.0",
]

[project.scripts]
sentinel = "sentinelcode.cli:app"

[project.urls]
Homepage = "https://github.com/your-org/sentinel-as-code"
Repository = "https://github.com/your-org/sentinel-as-code"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinelcode"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "PTH", # use pathlib
    "RUF", # ruff-specific
]
ignore = [
    "B008", # function call in argument defaults (typer uses this pattern)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.12"
# Permissive mode, as requested in the spec.
ignore_missing_imports = true
warn_unused_ignores = false
warn_redundant_casts = true
disallow_untyped_defs = false
check_untyped_defs = true
no_implicit_optional = true
files = ["src/sentinelcode"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "docker: tests that require Docker and the Zircolite engine (deselected by default).",
]
